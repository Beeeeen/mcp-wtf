# Publishes to npm via OIDC Trusted Publishing on every v* tag.
# npm side: package Settings -> Trusted Publisher -> GitHub Actions,
# repository Beeeeen/mcp-wtf, workflow release.yml. No token anywhere.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install
      - run: npm test
      - run: npm publish --provenance --access public
